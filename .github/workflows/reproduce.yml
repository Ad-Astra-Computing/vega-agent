# Reusable reproducer workflow (trust-model layer 5). Given a build's provenance,
# it rebuilds the same derivation on a fresh GitHub runner under this repo's OIDC
# identity and attests the result to Vega. Run it from a repo DISTINCT from the
# original attester so the attestation counts as an independent tenant.
#
# Trigger it manually (workflow_dispatch) or call it from another workflow
# (workflow_call). For macOS reproduction set `runner: macos-latest`.
name: Reproduce

on:
  workflow_dispatch:
    inputs:
      flake_ref:
        description: "Flake reference, e.g. github:owner/repo"
        required: true
      attr:
        description: "Attribute, e.g. packages.x86_64-linux.hello"
        required: true
      rev:
        description: "Locked commit revision to build at"
        required: true
      dir:
        description: "Subflake directory (?dir=), for a monorepo flake in a subdirectory (optional)"
        required: false
        default: ""
      expect_store_path:
        description: "Expected output store path (optional, for a divergence report)"
        required: false
        default: ""
      expect_narhash:
        description: "Expected narHash, sha256:... (optional)"
        required: false
        default: ""
      hash:
        description: "Candidate store-path hash, so a FAILED reproduction can be reported against it (optional)"
        required: false
        default: ""
      runner:
        description: "Runner to reproduce on"
        required: false
        default: "ubuntu-latest"
        type: choice
        options: ["ubuntu-latest", "macos-latest"]
  workflow_call:
    inputs:
      flake_ref: { required: true, type: string }
      attr: { required: true, type: string }
      rev: { required: true, type: string }
      dir: { required: false, type: string, default: "" }
      expect_store_path: { required: false, type: string, default: "" }
      expect_narhash: { required: false, type: string, default: "" }
      hash: { required: false, type: string, default: "" }
      runner: { required: false, type: string, default: "ubuntu-latest" }

permissions:
  id-token: write # GitHub Actions OIDC, so Vega can verify the runner identity
  contents: read

# Serialize duplicate reproductions of the same target instead of queueing many
# identical builds; do not cancel an in-flight one.
concurrency:
  group: reproduce-${{ inputs.flake_ref }}-${{ inputs.dir }}-${{ inputs.attr }}-${{ inputs.rev }}-${{ inputs.runner }}
  cancel-in-progress: false

jobs:
  reproduce:
    runs-on: ${{ inputs.runner }}
    steps:
      - name: Constrain runner
        # workflow_call cannot use a `choice` input like workflow_dispatch, so a
        # caller could pass an arbitrary `runner` label and steer this signing-gate
        # reproduction onto operator-chosen hardware (e.g. a self-hosted runner),
        # weakening the "fresh, independent, ephemeral runner" assumption the trust
        # model rests on. Fail closed unless the label is a known GitHub-hosted
        # ephemeral runner. The input is passed via env, not inlined into the
        # script, so it cannot inject shell.
        env:
          RUNNER_INPUT: ${{ inputs.runner }}
        run: |
          case "$RUNNER_INPUT" in
            ubuntu-latest|ubuntu-24.04|ubuntu-22.04|macos-latest|macos-15|macos-14|macos-13) ;;
            *) echo "refusing to reproduce on non-allowlisted runner '$RUNNER_INPUT'" >&2; exit 1 ;;
          esac
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false # no git push; do not leave the token in .git/config
      - name: Install Nix
        uses: DeterminateSystems/nix-installer-action@ef8a148080ab6020fd15196c2084a2eea5ff2d25 # v22
        with:
          # Pin the Nix release the installer fetches, so this signing-gate lane
          # cannot be shifted by a change to the installer's default version.
          source-tag: v3.21.0
          extra-conf: |
            experimental-features = nix-command flakes
            sandbox = true
            # A build that cannot be sandboxed must fail, not run unsandboxed.
            # Nix's default sandbox-fallback would silently drop isolation if
            # sandbox setup failed, and this reproducer builds attacker-chosen
            # flake refs whose byte agreement gates the master signing key.
            sandbox-fallback = false
            # Native builds only: do not register emulated platforms (e.g. Rosetta
            # x86_64-darwin on an arm64 macOS runner). A wrong-arch reproduction
            # must fail rather than complete under emulation, where differing bytes
            # for the same store path could forge a divergence on a signed output.
            extra-platforms =
      - name: Set up Node
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: "24"
      - name: Install agent deps
        run: npm ci
      - name: Reproduce and attest
        env:
          # Hardcoded, not an input: the agent must only ever send its OIDC token
          # to the real control plane. An attacker-set URL would harvest the token.
          VEGA_URL: "https://vega-cache.dev"
          VEGA_FLAKE_REF: ${{ inputs.flake_ref }}
          VEGA_ATTR: ${{ inputs.attr }}
          VEGA_REV: ${{ inputs.rev }}
          VEGA_DIR: ${{ inputs.dir }}
          VEGA_EXPECT_STORE_PATH: ${{ inputs.expect_store_path }}
          VEGA_EXPECT_NARHASH: ${{ inputs.expect_narhash }}
          # Names the candidate, so a reproduction that FAILS can say which one.
          # Without it a failure is anonymous and the queue keeps re-dispatching
          # work that can never succeed.
          VEGA_HASH: ${{ inputs.hash }}
        run: node_modules/.bin/tsx agent/reproduce.ts
