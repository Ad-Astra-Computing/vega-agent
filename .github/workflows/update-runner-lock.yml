name: Update runner lock

# Separate from update-flake-lock.yml: this advances ONLY nixpkgs-runner, on its
# own branch, so automerge-flake-lock.yml can auto-merge it without also
# auto-merging the rest of the toolchain's weekly bump.
on:
  schedule:
    - cron: "10 4 * * 1" # Mondays, 04:10 UTC
  workflow_dispatch:

permissions:
  contents: write
  pull-requests: write

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: DeterminateSystems/nix-installer-action@3138316df39ed29be04236d7ffc686fa525866aa # v23
      - uses: DeterminateSystems/update-flake-lock@da03c0f078bc4b2c37ee4f7e072d34bf8f188bb3 # v29
        with:
          pr-title: "Update runner lock"
          inputs: nixpkgs-runner
          branch: update_runner_lock_action
