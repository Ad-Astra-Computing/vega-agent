name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: "24"
      - run: npm ci
      - run: npm run typecheck
      # The builder boot-shim tests run each case under a REAL busybox (its
      # semantics differ from GNU tools where it broke the shim once); without
      # one that pass silently SKIPs, so provision it and fail the wrapper on
      # a skip when CI is set.
      - run: sudo apt-get install -y --no-install-recommends busybox-static
      - run: npm test
