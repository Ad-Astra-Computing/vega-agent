name: Auto-merge flake.lock

# Merges the weekly flake.lock update PR once its checks pass, the same way
# dependabot-automerge.yml does for Dependabot. Without this the PR sits
# waiting on a human every week, which is how the nixpkgs-runner input went
# stale before it tracked nixos-unstable (see flake.nix).
on: pull_request

permissions:
  contents: write
  pull-requests: write

jobs:
  automerge:
    runs-on: ubuntu-latest
    if: >-
      github.actor == 'github-actions[bot]' &&
      github.event.pull_request.head.ref == 'update_flake_lock_action' &&
      github.event.pull_request.head.repo.full_name == github.repository
    steps:
      - name: Enable auto-merge
        run: gh pr merge --auto --squash "$PR_URL"
        env:
          PR_URL: ${{ github.event.pull_request.html_url }}
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
